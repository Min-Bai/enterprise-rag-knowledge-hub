name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      JWT_EXPIRE_MINUTES: "30"
      SQL_ECHO: "false"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: INFO
      DEEPSEEK_API_KEY: ""
      REDIS_URL: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/app/tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  production-images:
    name: Production image checks
    runs-on: ubuntu-latest
    env:
      MAX_API_IMAGE_BYTES: "3221225472"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: enterprise-rag-api:ci
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api

      - name: Verify CPU-only API image and size
        run: |
          docker run --rm enterprise-rag-api:ci python -c "import torch; assert torch.version.cuda is None, torch.version.cuda; print(torch.__version__)"
          image_size="$(docker image inspect enterprise-rag-api:ci --format '{{.Size}}')"
          echo "API image size: $image_size bytes"
          test "$image_size" -le "$MAX_API_IMAGE_BYTES"

      - name: Build web production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web
