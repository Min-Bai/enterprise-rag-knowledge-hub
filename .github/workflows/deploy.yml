name: Build and Deploy Enterprise RAG

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-images:
    name: Build and publish GHCR images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.api-meta.outputs.tags }}
      web_image: ${{ steps.web-meta.outputs.tags }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out checked CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/enterprise-rag-api
          tags: type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Define web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/enterprise-rag-web
          tags: type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable deployment images
        env:
          API_IMAGE: ${{ steps.api-meta.outputs.tags }}
          WEB_IMAGE: ${{ steps.web-meta.outputs.tags }}
        run: |
          docker pull "$API_IMAGE"
          docker pull "$WEB_IMAGE"
          docker save --output "$RUNNER_TEMP/enterprise-rag-images.tar" "$API_IMAGE" "$WEB_IMAGE"

      - name: Upload immutable deployment images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-rag-images-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/enterprise-rag-images.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy to Enterprise RAG VM
    needs: build-images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    concurrency:
      group: enterprise-rag-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_IMAGE: ${{ needs.build-images.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
    steps:
      - name: Download immutable deployment images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-rag-images-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}\enterprise-rag-images

      - name: Verify deployment image archive
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'enterprise-rag-images\enterprise-rag-images.tar'
          if (!(Test-Path -LiteralPath $archive)) {
            throw "Deployment image archive was not downloaded: $archive"
          }
          "IMAGE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Transfer immutable images to virtual machine
        shell: powershell
        run: |
          scp $env:IMAGE_ARCHIVE enterprise-rag-vm:/tmp/enterprise-rag-images.tar

      - name: Deploy checked CI commit
        shell: powershell
        run: |
          $remoteCommand = "cd ~/enterprise-rag-knowledge-hub && git fetch origin main && git show '$($env:DEPLOY_SHA):scripts/deploy_enterprise_rag.sh' > /tmp/deploy_enterprise_rag.sh && bash /tmp/deploy_enterprise_rag.sh '$env:DEPLOY_SHA' '$env:API_IMAGE' '$env:WEB_IMAGE' /tmp/enterprise-rag-images.tar"
          ssh enterprise-rag-vm $remoteCommand

      - name: Remove staged image archive
        if: always()
        shell: powershell
        run: |
          ssh enterprise-rag-vm "rm -f /tmp/enterprise-rag-images.tar /tmp/deploy_enterprise_rag.sh"
          if ($env:IMAGE_ARCHIVE) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:IMAGE_ARCHIVE
          }

      - name: Check API health
        shell: powershell
        run: |
          ssh enterprise-rag-vm "curl --fail --silent --show-error http://localhost:8000/health"
