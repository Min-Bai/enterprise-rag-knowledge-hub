name: Build and Deploy Enterprise RAG

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-images:
    name: Build and publish GHCR images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.api-meta.outputs.tags }}
      web_image: ${{ steps.web-meta.outputs.tags }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out checked CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Define API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/enterprise-rag-api
          tags: type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Define web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/enterprise-rag-web
          tags: type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release Docker build cache before export
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true
          docker system prune --all --force --volumes
          df -h /

      - name: Export immutable API image
        env:
          API_IMAGE: ${{ steps.api-meta.outputs.tags }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/enterprise-rag-images"
          docker pull "$API_IMAGE"
          docker save "$API_IMAGE" | gzip -1 > "$RUNNER_TEMP/enterprise-rag-images/api.tar.gz"
          docker image rm --force "$API_IMAGE"

      - name: Export immutable web image
        env:
          WEB_IMAGE: ${{ steps.web-meta.outputs.tags }}
        run: |
          set -o pipefail
          docker pull "$WEB_IMAGE"
          docker save "$WEB_IMAGE" | gzip -1 > "$RUNNER_TEMP/enterprise-rag-images/web.tar.gz"
          docker image rm --force "$WEB_IMAGE"

      - name: Upload immutable deployment images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-rag-images-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/enterprise-rag-images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy to Enterprise RAG VM
    needs: build-images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    concurrency:
      group: enterprise-rag-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_IMAGE: ${{ needs.build-images.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
    steps:
      - name: Download immutable deployment images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-rag-images-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}\enterprise-rag-images

      - name: Verify deployment image archive
        shell: powershell
        run: |
          $apiArchive = Join-Path $env:RUNNER_TEMP 'enterprise-rag-images\api.tar.gz'
          $webArchive = Join-Path $env:RUNNER_TEMP 'enterprise-rag-images\web.tar.gz'
          if (!(Test-Path -LiteralPath $apiArchive) -or !(Test-Path -LiteralPath $webArchive)) {
            throw 'One or more deployment image archives were not downloaded.'
          }
          "API_ARCHIVE=$apiArchive" >> $env:GITHUB_ENV
          "WEB_ARCHIVE=$webArchive" >> $env:GITHUB_ENV

      - name: Transfer immutable images to virtual machine
        shell: powershell
        run: |
          scp $env:API_ARCHIVE enterprise-rag-vm:/tmp/enterprise-rag-api-image.tar.gz
          scp $env:WEB_ARCHIVE enterprise-rag-vm:/tmp/enterprise-rag-web-image.tar.gz

      - name: Deploy checked CI commit
        shell: powershell
        run: |
          $remoteCommand = "cd ~/enterprise-rag-knowledge-hub && git fetch origin main && git show '$($env:DEPLOY_SHA):scripts/deploy_enterprise_rag.sh' > /tmp/deploy_enterprise_rag.sh && bash /tmp/deploy_enterprise_rag.sh '$env:DEPLOY_SHA' '$env:API_IMAGE' '$env:WEB_IMAGE' /tmp/enterprise-rag-api-image.tar.gz /tmp/enterprise-rag-web-image.tar.gz"
          ssh enterprise-rag-vm $remoteCommand

      - name: Remove staged image archive
        if: always()
        shell: powershell
        run: |
          ssh enterprise-rag-vm "rm -f /tmp/enterprise-rag-api-image.tar.gz /tmp/enterprise-rag-web-image.tar.gz /tmp/deploy_enterprise_rag.sh"
          if ($env:API_ARCHIVE) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:API_ARCHIVE
          }
          if ($env:WEB_ARCHIVE) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:WEB_ARCHIVE
          }

      - name: Check API health
        shell: powershell
        run: |
          ssh enterprise-rag-vm "curl --fail --silent --show-error http://localhost:8000/health"
