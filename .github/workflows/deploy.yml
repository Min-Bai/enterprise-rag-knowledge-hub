name: Deploy Enterprise RAG

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Enterprise RAG VM
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    concurrency:
      group: enterprise-rag-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Deploy checked CI commit
        shell: powershell
        run: |
          ssh enterprise-rag-vm "bash ~/deploy-enterprise-rag.sh $env:DEPLOY_SHA"

      - name: Check API health
        shell: powershell
        run: |
          ssh enterprise-rag-vm "curl --fail --silent --show-error http://localhost:8000/health"
