name: Build and Deploy Enterprise RAG

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build and publish GHCR images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.api-meta.outputs.tags }}
      web_image: ${{ steps.web-meta.outputs.tags }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out checked CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/enterprise-rag-api
          tags: type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Define web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/enterprise-rag-web
          tags: type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Enterprise RAG VM
    needs: build-images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    concurrency:
      group: enterprise-rag-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_IMAGE: ${{ needs.build-images.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
    steps:
      - name: Install native daemonless image client
        shell: powershell
        run: |
          $version = 'v0.20.3'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'crane'
          $archive = Join-Path $env:RUNNER_TEMP "go-containerregistry-$version-windows-x86_64.tar.gz"
          New-Item -ItemType Directory -Force $toolDirectory | Out-Null
          Invoke-WebRequest -Uri "https://github.com/google/go-containerregistry/releases/download/$version/go-containerregistry_Windows_x86_64.tar.gz" -OutFile $archive
          tar -xzf $archive -C $toolDirectory crane.exe
          "CRANE=$toolDirectory\\crane.exe" >> $env:GITHUB_ENV

      - name: Stage immutable images on Windows runner
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_TOKEN | & $env:CRANE auth login ghcr.io --username "${{ github.actor }}" --password-stdin
          $apiArchive = Join-Path $env:RUNNER_TEMP "enterprise-rag-api-$($env:DEPLOY_SHA).tar"
          $webArchive = Join-Path $env:RUNNER_TEMP "enterprise-rag-web-$($env:DEPLOY_SHA).tar"
          & $env:CRANE pull $env:API_IMAGE $apiArchive
          & $env:CRANE pull $env:WEB_IMAGE $webArchive
          "API_ARCHIVE=$apiArchive" >> $env:GITHUB_ENV
          "WEB_ARCHIVE=$webArchive" >> $env:GITHUB_ENV

      - name: Transfer immutable images to virtual machine
        shell: powershell
        run: |
          scp $env:API_ARCHIVE enterprise-rag-vm:/tmp/enterprise-rag-api-image.tar
          scp $env:WEB_ARCHIVE enterprise-rag-vm:/tmp/enterprise-rag-web-image.tar

      - name: Deploy checked CI commit
        shell: powershell
        run: |
          $remoteCommand = "cd ~/enterprise-rag-knowledge-hub && git fetch origin main && git show '$($env:DEPLOY_SHA):scripts/deploy_enterprise_rag.sh' > /tmp/deploy_enterprise_rag.sh && bash /tmp/deploy_enterprise_rag.sh '$env:DEPLOY_SHA' '$env:API_IMAGE' '$env:WEB_IMAGE' /tmp/enterprise-rag-api-image.tar /tmp/enterprise-rag-web-image.tar"
          ssh enterprise-rag-vm $remoteCommand

      - name: Remove staged image archive
        if: always()
        shell: powershell
        run: |
          ssh enterprise-rag-vm "rm -f /tmp/enterprise-rag-api-image.tar /tmp/enterprise-rag-web-image.tar /tmp/deploy_enterprise_rag.sh"
          if ($env:API_ARCHIVE) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:API_ARCHIVE
          }
          if ($env:WEB_ARCHIVE) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:WEB_ARCHIVE
          }

      - name: Check API health
        shell: powershell
        run: |
          ssh enterprise-rag-vm "curl --fail --silent --show-error http://localhost:8000/health"
