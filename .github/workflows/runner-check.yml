name: Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Verify Windows runner and Ubuntu access
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Show runner information
        shell: powershell
        run: |
          Write-Output "Runner host: $env:COMPUTERNAME"
          whoami
          ssh -V

      - name: Check Ubuntu deployment prerequisites
        shell: powershell
        run: |
          ssh todo-vm "test -x ~/deploy-api.sh && cd ~/todo-api && sudo docker compose ps"
