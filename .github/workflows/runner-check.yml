name: Enterprise RAG Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Verify Windows runner and Enterprise RAG VM access
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Show runner information
        shell: powershell
        run: |
          Write-Output "Runner host: $env:COMPUTERNAME"
          whoami
          ssh -V

      - name: Check Ubuntu deployment prerequisites
        shell: powershell
        run: |
          ssh enterprise-rag-vm "test -d ~/enterprise-rag-knowledge-hub/.git && command -v docker && command -v gzip && cd ~/enterprise-rag-knowledge-hub && docker compose version && docker compose ps"
