services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - backend/app/.env
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - todo-mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build: .
    image: todo-api:2
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - backend/app/.env
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /app/model-cache
      HF_ENDPOINT: https://hf-mirror.com
      QDRANT_URL: http://qdrant:6333
    volumes:
      - todo-api-data:/app/data
      - todo-document-data:/app/backend/app/data
      - todo-model-cache:/app/model-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic -c backend/app/alembic.ini upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      
  worker:
    build: .
    image: todo-api:2
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - backend/app/.env
    environment:
      HF_HOME: /app/model-cache
      HF_ENDPOINT: https://hf-mirror.com
      QDRANT_URL: http://qdrant:6333
    volumes:
      - todo-api-data:/app/data
      - todo-document-data:/app/backend/app/data
      - todo-model-cache:/app/model-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: python -m backend.app.worker

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes
    volumes:
      - todo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:v1.13.4
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - todo-qdrant-data:/qdrant/storage

  frontend:
    build:
      context: ./frontend
    image: todo-frontend:1
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  todo-api-data:
    external: true
  todo-redis-data:
  todo-qdrant-data:
  todo-model-cache:
  todo-document-data:
  todo-mysql-data:
