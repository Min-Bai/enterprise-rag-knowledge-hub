name: enterprise-rag

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - enterprise-rag-mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build: .
    image: enterprise-rag-api:1
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /app/model-cache
      HF_ENDPOINT: https://hf-mirror.com
      QDRANT_URL: http://qdrant:6333
    volumes:
      - enterprise-rag-api-data:/app/data
      - enterprise-rag-document-data:/app/backend/app/data
      - enterprise-rag-model-cache:/app/model-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic -c backend/app/alembic.ini upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      
  worker:
    build: .
    image: enterprise-rag-api:1
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      HF_HOME: /app/model-cache
      HF_ENDPOINT: https://hf-mirror.com
      QDRANT_URL: http://qdrant:6333
    volumes:
      - enterprise-rag-api-data:/app/data
      - enterprise-rag-document-data:/app/backend/app/data
      - enterprise-rag-model-cache:/app/model-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      celery -A backend.app.celery_app:celery_app worker
      --loglevel=INFO --queues=document.high,document.default,evaluation,maintenance --concurrency=1

  beat:
    build: .
    image: enterprise-rag-api:1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.app.celery_app:celery_app beat --loglevel=INFO

  flower:
    build: .
    image: enterprise-rag-api:1
    profiles: ["operations"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    command: celery -A backend.app.celery_app:celery_app flower --port=5555

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes
    volumes:
      - enterprise-rag-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:v1.13.4
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - enterprise-rag-qdrant-data:/qdrant/storage
    healthcheck:
      # The upstream image has Bash but not curl/wget. A TCP probe prevents
      # a false unhealthy state while API readiness verifies Qdrant's API.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    image: enterprise-rag-web:1
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  enterprise-rag-api-data:
    name: enterprise-rag-api-data
    external: true
  enterprise-rag-redis-data:
    name: enterprise-rag-redis-data
    external: true
  enterprise-rag-qdrant-data:
    name: enterprise-rag-qdrant-data
    external: true
  enterprise-rag-model-cache:
    name: enterprise-rag-model-cache
    external: true
  enterprise-rag-document-data:
    name: enterprise-rag-document-data
    external: true
  enterprise-rag-mysql-data:
    name: enterprise-rag-mysql-data
    external: true
